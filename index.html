  function validateData(data) {
    if(data?.version===1){
      const legacy=validateLegacy(data),id=uid();
      return {version:2,library:legacy.library,promptSets:[{id,name:'既存Prompt',prompts:legacy.prompts}],activePromptId:id,settings:{activeSide:'positive'}};
    }
    const fail=()=>{throw new Error(t('JSONの形式が対応していません。Prompt LibraryのExportファイルを選んでください。'));};
    if(!data||data.version!==2||!Array.isArray(data.promptSets)||!data.promptSets.length||data.promptSets.length>10000)fail();
    const ids=new Set();let library;
    const promptSets=data.promptSets.map(p=>{
      if(!p||typeof p.id!=='string'||p.id.length>200||!/^[a-zA-Z0-9_-]+$/.test(p.id)||ids.has(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name.length>200)fail();
      ids.add(p.id);
      const clean=validateLegacy({version:1,library:data.library,prompts:p.prompts});
      library??=clean.library;
      return {id:p.id,name:p.name,prompts:clean.prompts};
    });
    if(!ids.has(data.activePromptId)||!data.settings||!sides.includes(data.settings.activeSide))fail();
    return {version:2,library,promptSets,activePromptId:data.activePromptId,settings:{activeSide:data.settings.activeSide,...(['ja','en'].includes(data.settings.language)?{language:data.settings.language}:{})}};
  }

  function render(resetItems=false) {

  function bindMain() {

      else if(d.sub){view[activeSide].sub=d.sub;view[activeSide].search='';view[activeSide].tagSearch='';view[activeSide].blockSearch='';render(true);}
      else if(d.type){view[activeSide].type=d.type;render();}
      else if(d.editCategory)editCategory(d.editCategory);
      else if(d.editSub)editSub(d.editSub);
      else if(d.unselect){selected.delete(d.unselect);render();}
      else if(d.item){const i=currentView().sub?.items.find(i=>i.id===d.item);if(!i)return;if(page==='library'){if(i.type==='tag'&&selectionModes[activeSide]){selected.has(i.id)?selected.delete(i.id):selected.add(i.id);render();}else editItem(i.id);}else{togglePrompt(i);}}
      else if(d.remove){const p=currentPrompts()[activeSide];p.items=p.items.filter(i=>i.id!==d.remove);persist();render();}
      else if(d.move){const list=currentPrompts()[activeSide].items;const from=list.findIndex(i=>i.id===d.move),to=from+Number(d.direction);if(to>=0&&to<list.length){[list[from],list[to]]=[list[to],list[from]];persist();render();}}

    root.onchange=event=>{if(event.target.id==='prompt-set'){const id=event.target.value;if(state.promptSets.some(p=>p.id===id)&&id!==state.activePromptId){persist();state.activePromptId=id;dragId=null;persist();render();}return;}const id=event.target.dataset.select;if(id){event.target.checked?selected.add(id):selected.delete(id);render();}};
    const search=$('#library-search');if(search)search.oninput=()=>{view[activeSide].search=search.value;const caret=search.selectionStart;render();$('#library-search').focus();$('#library-search').setSelectionRange(caret,caret);};

    const direct=$('#direct-input');if(direct)direct.oninput=()=>{currentPrompts()[activeSide].direct=direct.value;$('#active-output').textContent=finalPrompt(activeSide);$('[data-action="clear-prompt"]').disabled=!currentPrompts()[activeSide].items.length&&!direct.value;persist();};
    root.ondragstart=event=>{const row=event.target.closest('[data-prompt-id]');if(!row)return;dragId=row.dataset.promptId;event.dataTransfer.setData('text/plain',dragId);event.dataTransfer.effectAllowed='move';row.classList.add('dragging');};
    root.ondragend=()=>{dragId=null;root.querySelectorAll('.dragging,.drag-over').forEach(r=>r.classList.remove('dragging','drag-over'));};
    root.ondragover=event=>{const row=event.target.closest('[data-prompt-id]');if(row&&dragId){event.preventDefault();event.dataTransfer.dropEffect='move';row.classList.add('drag-over');}};
    root.ondragleave=event=>event.target.closest('[data-prompt-id]')?.classList.remove('drag-over');
    root.ondrop=event=>{const row=event.target.closest('[data-prompt-id]');if(!row||!dragId)return;event.preventDefault();const list=currentPrompts()[activeSide].items,from=list.findIndex(i=>i.id===dragId),to=list.findIndex(i=>i.id===row.dataset.promptId);if(from>=0&&to>=0&&from!==to){list.splice(to,0,list.splice(from,1)[0]);persist();render();}dragId=null;};
    const input=$('#png-file');if(input)input.onchange=()=>{if(input.files[0])loadPNG(input.files[0]);};
    const drop=$('#drop-zone');if(drop){drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])loadPNG(e.dataTransfer.files[0]);};}
  }
  function field(name,label,value='',multiline=false) {return L`<div class="form-field"><label for="field-${name}">${label}</label>${multiline?L`<textarea id="field-${name}" name="${name}" required>${escape(value)}</textarea>`:L`<input id="field-${name}" name="${name}" value="${escape(value)}" required maxlength="${name==='name'?200:10000}">`}</div>`;}

  function runAction(action) {

    const revision=++pngVersion;if(png.url)URL.revokeObjectURL(png.url);png={name:file.name,url:'',positive:'',negative:'',info:'',error:'',loading:true};render();

      png.url=URL.createObjectURL(file);const parameters=metadata.find(m=>m.key.toLowerCase()==='parameters');
      if(parameters){Object.assign(png,splitParameters(parameters.text));if(!png.info)png.error=t('parametersは読み取れましたが、Generation Infoの区切りを特定できませんでした。');}
      else {png.error=t('parametersが見つかりませんでした。');png.info=metadata.map(m=>L`${m.key}\n${m.text}`).join('\n\n');}
      if(warnings.length)png.error=[png.error,...warnings].filter(Boolean).join('\n');
    }catch(error){if(revision===pngVersion)png.error=error.message;}
    finally{if(revision===pngVersion){png.loading=false;if(page==='png')render();}}
  }
  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();});
  $('#close-editor').onclick=$('#cancel-editor').onclick=()=>$('#editor').close();
  $('#editor-form').onsubmit=event=>{event.preventDefault();try{dialogSubmit(event.target);$('#editor').close();}catch(error){$('#editor-error').textContent=error.message;}};
  $('#export').onclick=()=>{$('.data-menu').open=false;downloadJSON();};$('#import').onclick=()=>{$('.data-menu').open=false;$('#import-file').click();};$('#import-file').onchange=()=>{if($('#import-file').files[0])importJSON($('#import-file').files[0]);};
  $('#preset-export').onclick=()=>{$('.data-menu').open=false;exportPreset();};
  $('#preset-import').onclick=()=>{$('.data-menu').open=false;$('#preset-import-file').click();};
  $('#preset-import-file').onchange=()=>{const file=$('#preset-import-file').files[0];if(file)importPreset(file);};
  async function init() {
    $('#main').innerHTML=t('<div class="loading">Libraryを読み込み中…</div>');
    try{db=await openDB();const saved=await readDB();state=saved?validateData(saved):seed();if(state.settings.language)setLanguage(state.settings.language,false);activeSide=state.settings.activeSide;selected=selections[activeSide];render();
      if(saved?.version===1){await new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(saved,'legacy-state-v1');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error(t('移行前バックアップを保存できませんでした')));});await persist();}
      else if(!saved)persist();else $('#save-status').textContent=t('ブラウザ内に保存済み');}
    catch(error){state=seed();render();$('#save-status').textContent=t('保存データを読み込めませんでした');toast(t('保存データを読み込めませんでした。自動上書きは行いません。'));db=null;}
  }
  let pngSelection=null;
  let currentPromptHeight=(()=>{try{const value=Number(localStorage.getItem('prompt-library-current-height'));return Number.isFinite(value)&&value>0?value:null;}catch{return null;}})();
  function bindPromptResize(){
    const panel=$('#current-prompt-panel'),handle=$('#prompt-resize');if(!panel||!handle)return;
    const limits=()=>{const min=window.innerWidth<=700?210:132;return {min,max:Math.max(min,window.innerHeight-Math.max(0,panel.getBoundingClientRect().top)-156)};};
    const resize=(height,save=false)=>{
      const {min,max}=limits(),next=Math.max(min,Math.min(max,height));
      panel.style.minHeight=min+'px';panel.style.height=next+'px';
      handle.setAttribute('aria-valuemin',min);handle.setAttribute('aria-valuemax',max);handle.setAttribute('aria-valuenow',Math.round(next));
      if(save){currentPromptHeight=next;try{localStorage.setItem('prompt-library-current-height',String(next));}catch{}}
    };
    resize(currentPromptHeight??panel.getBoundingClientRect().height);
    handle.onpointerdown=event=>{
      if(event.button!==0)return;event.preventDefault();handle.focus({preventScroll:true});handle.setPointerCapture(event.pointerId);
      const startY=event.clientY,startHeight=panel.getBoundingClientRect().height;
      handle.onpointermove=move=>{if(move.pointerId===event.pointerId)resize(startHeight+move.clientY-startY);};
      const finish=end=>{if(end.pointerId!==event.pointerId)return;resize(panel.getBoundingClientRect().height,true);handle.onpointermove=null;handle.onpointerup=null;handle.onpointercancel=null;};
      handle.onpointerup=finish;handle.onpointercancel=finish;
    };
    handle.onkeydown=event=>{
      const {min,max}=limits();let next=panel.getBoundingClientRect().height;
      if(event.key==='ArrowUp')next-=20;else if(event.key==='ArrowDown')next+=20;else if(event.key==='Home')next=min;else if(event.key==='End')next=max;else return;
      event.preventDefault();resize(next,true);
    };
  }
  window.addEventListener('resize',()=>bindPromptResize());
  function updateBlockTagText(text,tag,checked){
    // Match the literal tag between comma separators; retain every other text segment.
    let start=0,match=null;
    while(start<=text.length){
      const at=text.indexOf(tag,start);if(at<0)break;
      const left=/(?:^|,)\s*$/.exec(text.slice(0,at)),right=/^\s*(?:,|$)/.exec(text.slice(at+tag.length));
      if(left&&right){match={at,left,right};break;}start=at+1;
    }
    if(checked)return match?text:text+(text.trim()?', ':'')+tag;
    if(!match)return text;
    const {at,left,right}=match,end=at+tag.length;
    if(right[0].includes(','))return text.slice(0,at)+text.slice(end+right[0].length).replace(/^\s*/,'');
    if(left[0].includes(','))return text.slice(0,left.index)+text.slice(end);
    return text.slice(0,at)+text.slice(end);
  }
  document.addEventListener('selectionchange',()=>{
    if(page!=='png')return;
    const selection=window.getSelection();pngSelection=null;
    if(selection&&!selection.isCollapsed&&selection.rangeCount){
      const range=selection.getRangeAt(0);
      for(const side of sides){const el=$('#png-'+side);if(el&&el.contains(range.startContainer)&&el.contains(range.endContainer)&&selection.toString().trim())pngSelection={side,text:selection.toString(),revision:pngVersion};}
    }
    document.querySelectorAll('[data-png-library]').forEach(b=>b.disabled=pngSelection?.side!==b.dataset.pngLibrary);
  });
  // Preserve the observed range when a button receives focus (including touch).
  document.addEventListener('pointerdown',event=>{if(event.target.closest('[data-png-library]'))event.preventDefault();});
  function sendPNGToPrompt(){
    if(png.loading||(!png.positive&&!png.negative))return;
    const target=currentSet(), payload={positive:png.positive,negative:png.negative};
    const apply=()=>{
      for(const side of sides)target.prompts[side]={items:[],direct:payload[side]};
      page='prompt';activeSide=payload.positive?'positive':'negative';selected=selections[activeSide];persist();render();toast(t('PNGのPromptを送信しました。'));
    };
    if(sides.some(side=>target.prompts[side].items.length||target.prompts[side].direct)){
      showDialog(t('Send to Prompt'),L`<p class="confirm-description">「${escape(target.name)}」のPositive / NegativeをPNGの本文で置き換えます。現在の部品と直接入力は置き換わります。</p>`,apply,t('置き換え'));
    }else apply();
  }
  function sendSelectionToLibrary(side){
    const captured=pngSelection;
    if(!captured||captured.side!==side||captured.revision!==pngVersion){toast(t('Prompt本文から登録する文字列を選択してください。'));return;}
    const categories=state.library[side];
    const options=categories.map(c=>L`<option value="${c.id}">${escape(c.name)}</option>`).join('');
    showDialog(t('選択部分をLibraryへ'),L`<div class="form-field"><label for="png-target-side">Library</label><select id="png-target-side" disabled><option>${sideName(side)}</option></select></div><div class="form-field"><label for="png-kind">追加種別</label><select id="png-kind" name="kind"><option value="tag">Tag</option><option value="block">Block</option></select></div><div class="form-field"><label for="png-category">Category</label><select id="png-category" name="category" required>${options}</select></div><div class="form-field"><label for="png-subcategory">Subcategory</label><select id="png-subcategory" name="subcategory" required></select></div><div id="png-block-name" hidden>${field('name',t('Block名'))}</div>${field('text',t('Prompt内容'),captured.text,true)}<p class="hint" id="png-destination-hint" hidden>Libraryでカテゴリとサブカテゴリを作成してください。</p>`,form=>{
      const values=new FormData(form),kind=values.get('kind'),text=values.get('text').toString();
      if(!text.trim())throw new Error(t('空白のみの入力は保存できません。'));
      if(text.length>(kind==='tag'?10000:100000))throw new Error(t('選択テキストが長すぎます。選択範囲を短くしてください。'));
      const category=categories.find(c=>c.id===values.get('category')),sub=category?.subcategories.find(s=>s.id===values.get('subcategory'));
      if(!sub)throw new Error(t('保存先を選択してください。'));
      const name=kind==='block'?trimField(form,'name'):text;
      sub.items.push({id:uid(),type:kind,name,text,...(kind==='block'?{tagIds:[]}:{})});
      persist();toast(t('選択部分をLibraryに追加しました。'));
    },t('追加'));
    const cat=$('#png-category'),sub=$('#png-subcategory');
    const syncSub=()=>{const c=categories.find(c=>c.id===cat.value);sub.innerHTML=(c?.subcategories||[]).map(s=>L`<option value="${s.id}">${escape(s.name)}</option>`).join('');$('#submit-editor').disabled=!sub.options.length;$('#png-destination-hint').hidden=!!sub.options.length;};
    cat.value=view[side].category||categories[0]?.id||'';if(!cat.value&&categories.length)cat.value=categories[0].id;syncSub();
    if([...sub.options].some(o=>o.value===view[side].sub))sub.value=view[side].sub;
    cat.onchange=syncSub;
    $('#field-name').disabled=true;
    $('#png-kind').onchange=()=>{const block=$('#png-kind').value==='block';$('#png-block-name').hidden=!block;$('#field-name').disabled=!block;};
  }
  $('#language').onchange=()=>{setLanguage($('#language').value);render();};
  // Header controls remain outside the re-rendered workspace.
  function localizeStatic(){
    document.documentElement.lang=language;
    document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
    $('#language').value=language;$('#close-editor').setAttribute('aria-label',t('閉じる'));
    $('.tabs').setAttribute('aria-label',t('画面'));
    $('#submit-editor').disabled=false;
  }

  init();
})();
</script>
